name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: Production build and type check
        run: pnpm build
        env:
          MICROCMS_SERVICE_DOMAIN: ci-build
          MICROCMS_API_KEY: ci-placeholder
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-microcms.cjs
      - name: Smoke-test production pages
        run: node scripts/ci-smoke.mjs
        env:
          MICROCMS_SERVICE_DOMAIN: ci-build
          MICROCMS_API_KEY: ci-placeholder
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-microcms.cjs
