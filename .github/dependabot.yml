version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security-minor-patch:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Pacific/Auckland
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
